name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with: {go-version: '1.24.0'}
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with: {version: '0.11.6'}
      - run: test "$GITHUB_REF_NAME" = v0.1.0
      - run: go test ./... && uv sync --locked --all-groups && uv run python -m unittest discover -s tests -v
      - run: mkdir assets && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o assets/safe-svc-capture_0.1.0_windows_amd64.exe ./cmd/safe-svc-capture && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o assets/safe-svc-capture_0.1.0_linux_amd64 ./cmd/safe-svc-capture
      - run: uv build --out-dir assets && cp contract/snapshot-v1.schema.json assets/ && cd assets && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with: {name: release-assets, path: assets/}
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with: {name: release-assets, path: assets}
      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: assets/*
          body: |
            Observation comparison only. One Safe and one endpoint. No chain-truth guarantee.
            No raw signatures or raw pages. No PyPI publication. Incomplete snapshots require explicit override.
